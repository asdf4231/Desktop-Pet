[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shaqiu-desktop-pet"
version = "0.2.0"
description = "An animated desktop companion with chat and attention training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "platformdirs>=4,<5",
    "keyring>=25,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.9,<1",
]

[project.scripts]
shaqiu-pet = "shaqiu_pet.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
shaqiu_pet = ["assets/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
